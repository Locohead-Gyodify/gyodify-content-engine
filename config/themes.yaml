# GYODIFY Evergreen Themes Bank
# Used when live research is thin or all sources fail
# 60+ original relatable meme premises tied to fashion/gen-z life

themes:
  wardrobe_paradox:
    - "Wardrobe full. Nothing to wear. Classic."
    - "Added to cart. Left it there. Eventually bought it. Wore it every day."
    - "Bought a tee. Wore it 3x a week. Worth it."
    - "\"I have nothing to wear\" said the person with 40 tees."

  monday_energy:
    - "Monday morning energy: outfit doing all the heavy lifting."
    - "Alarm at 6. Snooze until 7:40. Still showed up looking good."
    - "The only thing ready by 8 AM is the fit."
    - "POV: Your outfit is more prepared for Monday than you are."

  oversized_debates:
    - "Oversized tee discourse: it's not too big, your taste is too small."
    - "Some say oversized is lazy. Those people are wrong."
    - "Mom: \"that's too big for you.\" Me: \"exactly.\""
    - "Oversized fit > fitted anything. This is not up for debate."

  exam_season:
    - "Exam week uniform: hoodie, track pants, questionable life choices."
    - "Study mode activated. Comfort level: maximum."
    - "If the assignment is submitted, the fit can be relaxed."
    - "Finals week: your GPA may suffer but the fit never will."

  group_photo_panic:
    - "Group photo in 10 mins. Outfit: chosen 3 days ago."
    - "Everyone else is figuring out what to wear. You already know."
    - "No outfit panic if you're always ready. Just saying."

  main_character:
    - "Walking to class like the opening scene of a coming-of-age film."
    - "Main character energy is a mindset. The tee just confirms it."
    - "Every playlist has a main character song. Every wardrobe needs a GYODIFY tee."

  laundry_day:
    - "Laundry day survival kit: your most loved tee that somehow survived."
    - "Laundry pile: 1. Clean tees: 1. Life: balanced."
    - "The tee that gets washed most = the tee that matters most."

  custom_print:
    - "Your meme. Our print. Their reaction: priceless."
    - "Imagine wearing a joke that only your group gets. We made that possible."
    - "If your personality had a tee, what would it say?"
    - "Screenshot → Upload → Wear. Your meme just levelled up."

  sizing_confusion:
    - "Size chart: exists. Me: wears L anyway. Oversized tee: understands."
    - "One size fits all is a lie. Oversized is the truth."
    - "S M L XL — why pick one when oversized is always right."

  wedding_guest:
    - "Wedding guest outfit: sorted. Looking better than the groom: unintentional."
    - "Shaadi season look: graphic tee + nice pants = surprisingly works."
    - "Dress code: smart casual. Translation: wear the GYODIFY tee, it's fine."

  thrift_finds:
    - "Found a vintage look for ₹349. That's the GYODIFY promise."
    - "Thrift energy without the thrift hunt."
    - "Priced like a find. Quality like a keeper."

  monsoon_fits:
    - "Monsoon hair: chaotic. Fit: immaculate. Balance achieved."
    - "Rainy season is no excuse for a bad outfit."
    - "Wet shoes, dry drip."

  night_out:
    - "Zero plans until 9 PM. Full fit ready by 9:15."
    - "\"It's just a casual thing\" requires at least one banger tee."
    - "Late night plans: graphic tee, yes. Overthinking: no."

  nothing_fancy:
    - "No occasion needed. Just a good tee and somewhere to be."
    - "The best fits are the ones with no particular destination."
    - "Dressing up is for special occasions. Dressing loud is everyday."

  gifting:
    - "The gift that says 'I know your personality.'"
    - "Custom print tee: more personal than a voucher, more wearable than a mug."
    - "If they wear tees every day, the answer is obvious."

  campus_life:
    - "Lecture at 8. Canteen by 9. Looking good the whole time."
    - "College taught me many things. GYODIFY taught me how to dress."
    - "Back row energy with front row fits."
