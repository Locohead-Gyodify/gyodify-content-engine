name: GYODIFY Daily Content Engine

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST (GitHub cron may run a few mins late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Telegram delivery)"
        required: false
        default: "false"
        type: string
      language:
        description: "Force language (english/hindi/marathi/hinglish)"
        required: false
        type: string
      format:
        description: "Force format (carousel/reel/post)"
        required: false
        type: string
      date:
        description: "Simulate date (YYYY-MM-DD)"
        required: false
        type: string
      position:
        description: "Force feed position (1-6)"
        required: false
        type: string

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write   # for committing history.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto libraqm0 libasound2t64

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium

      - name: Run content engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.language }}" ]; then
            ARGS="$ARGS --language ${{ github.event.inputs.language }}"
          fi
          if [ -n "${{ github.event.inputs.format }}" ]; then
            ARGS="$ARGS --format ${{ github.event.inputs.format }}"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ -n "${{ github.event.inputs.position }}" ]; then
            ARGS="$ARGS --position ${{ github.event.inputs.position }}"
          fi
          python -m src.main $ARGS

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gyodify-output-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Commit updated history.json
        if: success()
        run: |
          git config --local user.email "gyodify-bot@users.noreply.github.com"
          git config --local user.name "GYODIFY Engine"
          git add data/history.json
          git diff --cached --quiet || git commit -m "chore: update history [skip ci]"
          git push

      - name: Send failure alert to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ GYODIFY engine failed — Run #${{ github.run_number }}. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d parse_mode="Markdown" || true
